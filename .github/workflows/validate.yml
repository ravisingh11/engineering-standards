name: Validate

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ground-truth:
    name: Validate / ground truth
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate declared repository ground truth
        run: python3 .guardrails/validate_ground_truth.py --policy .guardrails/ground-truth-ai.yaml

  docs:
    name: Validate / docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate documentation
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUSH_FORCED: ${{ github.event.forced || false }}
        run: |
          args=()
          if [[ "$PUSH_FORCED" != "true" && -n "$BASE_REF" ]]; then
            args+=(--base-ref "$BASE_REF" --head-ref "$HEAD_REF" --fallback-base "origin/$DEFAULT_BRANCH")
          fi
          python3 tooling/validators/validate_documentation.py "${args[@]}"

  scope:
    name: Validate / scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.inspect.outputs.status }}
      metrics: ${{ steps.inspect.outputs.metrics }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect file and line scope
        id: inspect
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUSH_FORCED: ${{ github.event.forced || false }}
          SCOPE_FILE: ${{ runner.temp }}/agent-safe-scope.json
        run: |
          args=()
          if [[ "$PUSH_FORCED" != "true" && -n "$BASE_REF" ]]; then
            args+=(--base-ref "$BASE_REF" --head-ref "$HEAD_REF" --fallback-base "origin/$DEFAULT_BRANCH")
          fi
          python3 tooling/validators/inspect_change_scope.py "${args[@]}" --output "$SCOPE_FILE"
          echo "status=$(jq -r .status "$SCOPE_FILE")" >> "$GITHUB_OUTPUT"
          echo "metrics=$(jq -c .metrics "$SCOPE_FILE")" >> "$GITHUB_OUTPUT"

  repository:
    name: Validate / repository
    needs: [docs, scope, ground-truth]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate repository
        run: python3 tooling/validators/validate_repository.py
      - name: Check committed diff whitespace
        run: git show --check --format= HEAD
      - name: Record validation evidence
        env:
          EVIDENCE_FILE: ${{ runner.temp }}/agent-safe-evidence.json
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          SCOPE_STATUS: ${{ needs.scope.outputs.status }}
          SCOPE_METRICS: ${{ needs.scope.outputs.metrics }}
        run: |
          python3 - "$EVIDENCE_FILE" "$REVISION" <<'PY'
          import os
          import json
          import sys

          evidence = {
              "version": 1,
              "subject": {
                  "type": "git-commit",
                  "revision": sys.argv[2],
              },
              "checks": {
                  "repository-validation": {
                      "producer": "repository CI",
                      "status": "passed",
                      "evidence": [
                          "command: python3 tooling/validators/validate_repository.py",
                          "command: git show --check --format= HEAD",
                      ],
                  },
                  "documentation": {
                      "producer": "Validate / docs",
                      "status": "passed",
                      "evidence": [
                          "job: docs",
                          "command: python3 tooling/validators/validate_documentation.py",
                      ],
                  },
                  "change-scope": {
                      "producer": "Validate / scope",
                      "status": os.environ["SCOPE_STATUS"],
                      "evidence": [
                          "job: scope",
                          f"metrics: {os.environ['SCOPE_METRICS']}",
                      ],
                  },
              },
          }
          with open(sys.argv[1], "w", encoding="utf-8") as output:
              json.dump(evidence, output)
          PY
      - name: Exercise local attestation action
        uses: ./
        with:
          policy-file: .guardrails/policy.yaml
          evidence-file: ${{ runner.temp }}/agent-safe-evidence.json
          operation: change
          revision: ${{ github.event.pull_request.head.sha || github.sha }}
          subject-type: git-commit
