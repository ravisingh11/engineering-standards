name: Secret Scan

on:
  # This workflow is trusted base-branch code. It never checks out or runs PR
  # code while using SECURITY_SETTINGS_TOKEN.
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  configuration:
    name: Secret Scan Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      token_configured: ${{ steps.detect.outputs.token_configured }}
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TOKEN_CONFIGURED: ${{ secrets.SECURITY_SETTINGS_TOKEN != '' }}
    steps:
      - name: Detect verifier credential
        id: detect
        shell: bash
        run: echo "token_configured=${TOKEN_CONFIGURED}" >> "${GITHUB_OUTPUT}"

      - name: Publish Secret Scan no-result check
        if: steps.detect.outputs.token_configured != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          reason="SECURITY_SETTINGS_TOKEN is not configured."
          payload="$(jq -n --arg sha "${HEAD_SHA}" --arg reason "${reason}" '{name:"GitHub Secret Scan", head_sha:$sha, status:"completed", conclusion:"skipped", output:{title:"GitHub Secret Scan", summary:$reason}}')"
          printf '%s' "${payload}" | gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" --input - >/dev/null

  verifier:
    name: Secret Scan Evidence Probe
    needs: configuration
    if: needs.configuration.outputs.token_configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      ORGANIZATION_SCANNER_CONFIGURED: ${{ vars.SECRET_SCAN_COMMAND != '' }}
    steps:
      - name: Probe platform settings and open alerts
        id: verify
        env:
          GH_TOKEN: ${{ secrets.SECURITY_SETTINGS_TOKEN }}
          CHECKS_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          status="not_run"
          reason="GitHub security settings could not be verified."
          settings_file="${RUNNER_TEMP}/security-settings.json"
          alerts_file="${RUNNER_TEMP}/secret-alerts.json"
          if gh api "repos/${GITHUB_REPOSITORY}" >"${settings_file}" 2>"${RUNNER_TEMP}/settings-error"; then
            secret_status="$(jq -r '.security_and_analysis.secret_scanning.status // empty' "${settings_file}")"
            push_status="$(jq -r '.security_and_analysis.secret_scanning_push_protection.status // empty' "${settings_file}")"
            if [[ -z "${secret_status}" || -z "${push_status}" ]]; then
              status="not_run"
              reason="GitHub returned no security-setting status; SECURITY_SETTINGS_TOKEN needs repository Administration (read) and Secret scanning alerts (read)."
            elif [[ "${secret_status}" == "enabled" && "${push_status}" == "enabled" ]]; then
              if gh api "repos/${GITHUB_REPOSITORY}/secret-scanning/alerts?state=open&per_page=100" >"${alerts_file}" 2>"${RUNNER_TEMP}/alerts-error"; then
                open_alerts="$(jq 'length' <"${alerts_file}")"
                if [[ "${open_alerts}" == "0" ]]; then
                  status="passed"
                  reason="Secret Scanning and push protection are enabled; no open alerts were reported."
                else
                  status="failed"
                  reason="GitHub Secret Scanning reported ${open_alerts} open alert(s)."
                fi
              else
                status="not_run"
                reason="Secret scanning alerts could not be read: $(tr '\n' ' ' <"${RUNNER_TEMP}/alerts-error")"
              fi
            elif [[ "${secret_status}" == "disabled" || "${push_status}" == "disabled" ]]; then
              status="failed"
              reason="Secret Scanning=${secret_status}; push protection=${push_status}."
            else
              status="not_run"
              reason="GitHub returned unexpected security-setting status values: Secret Scanning=${secret_status}; push protection=${push_status}."
            fi
          else
            status="not_run"
            reason="GitHub security settings could not be read: $(tr '\n' ' ' <"${RUNNER_TEMP}/settings-error")"
          fi

          if [[ "${ORGANIZATION_SCANNER_CONFIGURED}" == "true" && "${status}" == "passed" ]]; then
            scanner_conclusion=""
            for _ in {1..12}; do
              scanner_conclusion="$(GH_TOKEN="${CHECKS_TOKEN}" gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" | jq -r '[.check_runs[] | select(.name == "Secret Scan / organization scanner") | select(.status == "completed")] | sort_by(.completed_at) | last.conclusion // ""')"
              [[ -n "${scanner_conclusion}" ]] && break
              sleep 10
            done
            if [[ "${scanner_conclusion}" != "success" && "${scanner_conclusion}" != "neutral" && -n "${scanner_conclusion}" ]]; then
              status="failed"
              reason="Organization secret scanner concluded ${scanner_conclusion}."
            elif [[ -z "${scanner_conclusion}" ]]; then
              status="failed"
              reason="Organization secret scanner did not report a completed result for ${HEAD_SHA}."
            fi
          fi
          echo "status=${status}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"

      - name: Publish Secret Scan check for the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.verify.outputs.status }}
          REASON: ${{ steps.verify.outputs.reason }}
        shell: bash
        run: |
          set -euo pipefail
          case "${STATUS}" in
            passed) conclusion=success ;;
            failed) conclusion=failure ;;
            *) conclusion=skipped ;;
          esac
          payload="$(jq -n --arg sha "${HEAD_SHA}" --arg conclusion "${conclusion}" --arg reason "${REASON}" '{name:"GitHub Secret Scan", head_sha:$sha, status:"completed", conclusion:$conclusion, output:{title:"GitHub Secret Scan", summary:$reason}}')"
          printf '%s' "${payload}" | gh api --method POST "repos/${GITHUB_REPOSITORY}/check-runs" --input - >/dev/null

# SECURITY_SETTINGS_TOKEN is used only by this trusted, no-checkout evidence probe.
# The organization scanner is intentionally separate and runs on pull_request
# without credentials, then its result is included when configured.
