name: Semgrep

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  configuration:
    name: Semgrep Configuration
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.detect.outputs.configured }}
    steps:
      - name: Verify Semgrep token
        id: detect
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SEMGREP_APP_TOKEN}" || "${SEMGREP_APP_TOKEN}" == "GUARDRAILS_NOT_CONFIGURED" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Semgrep is advisory and not activated until SEMGREP_APP_TOKEN is configured."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "SEMGREP_APP_TOKEN is configured; the Semgrep scan may run."

  semgrep:
    name: Semgrep
    needs: configuration
    if: ${{ needs.configuration.outputs.configured == 'true' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) }}
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:155f999d01d02b33aa5a8db9186eb20dcd0154ce1a0ac6fce8d80674d0ace235
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run Semgrep CI
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: semgrep ci
