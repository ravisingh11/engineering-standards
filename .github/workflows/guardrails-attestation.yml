name: Guardrail Attestation

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: guardrail-attestation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate repository and documentation
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 tooling/validators/validate_repository.py
          python3 tooling/validators/validate_documentation.py \
            --base-ref "$BASE_REF" \
            --head-ref "$HEAD_REF" \
            --fallback-base "origin/$DEFAULT_BRANCH"

      - name: Run regression producer and record evidence
        env:
          REVISION: ${{ github.event.pull_request.head.sha }}
          EVIDENCE_FILE: ${{ runner.temp }}/guardrails-evidence.json
        run: |
          set -euo pipefail
          git diff --check
          python3 - "$EVIDENCE_FILE" "$REVISION" <<'PY'
          import json
          import sys

          evidence = {
              "version": 1,
              "subject": {
                  "type": "git-commit",
                  "revision": sys.argv[2],
              },
              "checks": {
                  "regression": {
                      "producer": "repository CI",
                      "status": "passed",
                      "evidence": ["command: git diff --check"],
                  },
                  "repository-validation": {
                      "producer": "repository CI",
                      "status": "passed",
                      "evidence": [
                          "command: python3 tooling/validators/validate_repository.py",
                      ],
                  },
                  "documentation": {
                      "producer": "repository CI",
                      "status": "passed",
                      "evidence": [
                          "command: python3 tooling/validators/validate_documentation.py",
                      ],
                  },
                  "sast": {
                      "producer": "repository SAST workflow",
                      "status": "not_run",
                      "reason": "Replace with the repository's real SAST result",
                  },
              },
          }
          with open(sys.argv[1], "w", encoding="utf-8") as output:
              json.dump(evidence, output)
          PY

      - name: Evaluate attestation
        env:
          REVISION: ${{ github.event.pull_request.head.sha }}
          EVIDENCE_FILE: ${{ runner.temp }}/guardrails-evidence.json
        run: |
          python3 .guardrails/evaluate.py \
            --policy .guardrails/policy.yaml \
            --evidence "$EVIDENCE_FILE" \
            --operation change \
            --revision "$REVISION" \
            --subject-type git-commit
