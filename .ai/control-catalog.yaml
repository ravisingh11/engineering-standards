{
  "version": 1,
  "controls": [
    {
      "id": "repository-validation",
      "name": "Repository Validation",
      "purpose": "Repository contracts, schemas, and validator correctness",
      "producer": ".github/workflows/validate.yml",
      "stage": "pull_request_and_push",
      "requiredness": "required",
      "activation": "github-native",
      "blocking": true,
      "status_context": "Validate / repository",
      "evidence": "successful repository validation workflow check"
    },
    {
      "id": "documentation",
      "name": "Documentation Validation",
      "purpose": "Internal links, documentation structure, and documentation contracts",
      "producer": ".github/workflows/validate.yml",
      "stage": "pull_request_and_push",
      "requiredness": "required",
      "activation": "github-native",
      "blocking": true,
      "status_context": "Validate / docs",
      "evidence": "successful documentation validation workflow check"
    },
    {
      "id": "repository-ground-truth",
      "name": "Ground Truth",
      "purpose": "Declared application-specific architecture, standards, testing, security, deployment, and contribution documents",
      "producer": ".guardrails/validate_ground_truth.py",
      "stage": "pull_request_and_push",
      "requiredness": "advisory",
      "activation": "repository",
      "blocking": false,
      "status_context": "Validate / ground truth",
      "evidence": "configured ground-truth document inventory"
    },
    {
      "id": "change-scope",
      "name": "Change Scope",
      "purpose": "Oversized or unexpectedly broad changes",
      "producer": ".github/workflows/validate.yml",
      "stage": "pull_request_and_push",
      "requiredness": "advisory",
      "activation": "github-native",
      "blocking": false,
      "status_context": "Validate / scope",
      "evidence": "scope metrics and threshold result"
    },
    {
      "id": "build",
      "name": "Build",
      "purpose": "Compilation, packaging, and build-time regressions",
      "producer": "workflows/build.yml",
      "stage": "pull_request",
      "requiredness": "required",
      "activation": "github-native",
      "blocking": true,
      "status_context": "Build",
      "evidence": "successful workflow check"
    },
    {
      "id": "unit-tests",
      "name": "Unit Tests",
