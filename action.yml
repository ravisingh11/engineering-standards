name: Guardrail Attestation
description: Evaluate revision-bound producer evidence against a repository policy
inputs:
  policy-file:
    description: Repository guardrail policy
    required: false
    default: .guardrails/policy.yaml
  evidence-file:
    description: JSON-compatible YAML evidence generated by producers
    required: true
  profiles-file:
    description: Installed Guardrails v2 profile definitions
    required: false
    default: .guardrails/profiles.yaml
  catalog-file:
    description: Installed Guardrails v2 control catalog
    required: false
    default: .guardrails/control-catalog.yaml
  providers-file:
    description: Installed Guardrails v2 provider configuration
    required: false
    default: .guardrails/providers.yaml
  operation:
    description: Policy operation to evaluate
    required: false
    default: change
  revision:
    description: Exact revision expected in the evidence
    required: true
  subject-type:
    description: Optional expected subject type such as git-commit
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Validate attestation inputs
      shell: bash
      env:
        POLICY_FILE: ${{ inputs.policy-file }}
        EVIDENCE_FILE: ${{ inputs.evidence-file }}
        REVISION: ${{ inputs.revision }}
      run: |
        set -euo pipefail
        if [[ -z "$REVISION" ]]; then
          echo "::error title=Missing revision::Pass the exact revision represented by the evidence."
          exit 2
        fi
        if [[ ! -f "$EVIDENCE_FILE" ]]; then
          echo "::error title=Missing evidence::Generate evidence from checks that actually ran before attestation."
          exit 2
        fi
        if [[ ! -f "$POLICY_FILE" ]]; then
          echo "::error title=Missing policy::Commit a repository-local .guardrails/policy.yaml policy."
          exit 2
        fi
    - name: Evaluate attestation
      shell: bash
      env:
        CATALOG_FILE: ${{ inputs.catalog-file }}
        POLICY_FILE: ${{ inputs.policy-file }}
        EVIDENCE_FILE: ${{ inputs.evidence-file }}
        OPERATION: ${{ inputs.operation }}
        PROFILES_FILE: ${{ inputs.profiles-file }}
        PROVIDERS_FILE: ${{ inputs.providers-file }}
        REVISION: ${{ inputs.revision }}
        SUBJECT_TYPE: ${{ inputs.subject-type }}
      run: |
        set -euo pipefail
        arguments=(
          --policy "$POLICY_FILE"
          --profiles "$PROFILES_FILE"
          --catalog "$CATALOG_FILE"
          --providers "$PROVIDERS_FILE"
          --evidence "$EVIDENCE_FILE"
          --operation "$OPERATION"
          --revision "$REVISION"
        )
        arguments+=(--subject-type "${SUBJECT_TYPE:-git-commit}")
        python3 "$GITHUB_ACTION_PATH/guardrails/evaluate.py" "${arguments[@]}"
branding:
  icon: shield
  color: blue
