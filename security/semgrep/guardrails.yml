{
  "rules": [
    {
      "id": "guardrails.python-disabled-tls-verification",
      "message": "TLS certificate verification must remain enabled.",
      "severity": "ERROR",
      "languages": ["python"],
      "pattern": "$CLIENT.$METHOD(..., verify=False, ...)"
    },
    {
      "id": "guardrails.javascript-disabled-tls-verification",
      "message": "TLS certificate verification must remain enabled.",
      "severity": "ERROR",
      "languages": ["javascript", "typescript"],
      "pattern": "new $AGENT({..., rejectUnauthorized: false, ...})"
    }
  ]
}
